id: iom-displacement-tracking-matrix
type: dataset
title: IOM Displacement Tracking Matrix (DTM)
description: |
  IOM's system for tracking and monitoring displacement and population mobility in crises: baseline and mobility-tracking assessments of internally displaced people and returnees, flow monitoring along migration routes, registration and surveys, published as country reports, datasets, maps and an API. A primary operational source for displacement figures in Sudan, Ukraine, Yemen, the Sahel and elsewhere.
publisher: International Organization for Migration (IOM)
jurisdiction:
  scope: multilateral
  country: null
topics:
- internal-displacement
- idps
- returnees
- flow-monitoring
- humanitarian
source:
  canonical_url: https://dtm.iom.int/
access:
  method:
  - web
  - api
  auth_required: false
  auth_note: The DTM API (v3) needs a free account and subscription key from the DTM Developer Portal; reports and public datasets need none
  rate_limit: null
status: live
status_since: '2026-10-31'
status_source: curator
observed:
  checked: '2026-11-01'
  reachable: true
  http_status: 200
  final_url: https://dtm.iom.int/
  redirect_chain: []
  fingerprint_result: no-baseline
coverage:
  spatial: crisis-affected countries where DTM operates (country, Admin 1 and Admin 2 levels)
  temporal: varies by country and operation
  cadence: irregular
license: proprietary (DTM Terms & Conditions; non-commercial viewing, download and print only, no redistribution or derivatives without IOM permission)
