title: EOIR Workload and Adjudication Statistics
description: |
  The Department of Justice Executive Office for Immigration Review's official statistics on the US immigration courts and Board of Immigration Appeals: pending cases, new cases and completions, decision outcomes, asylum applications and decisions, in absentia removal orders, representation rates, unaccompanied children's cases, appeals and immigration judge hiring. The government's own count of the immigration court backlog.
