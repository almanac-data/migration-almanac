id: iom-migration-data-portal
type: dataset
title: IOM Migration Data Portal
description: |
  IOM's portal of international migration statistics, compiled from more than 25 data providers: an interactive world map of internationally comparable indicators (immigration, emigration, labour migration, remittances, missing migrants, refugees, internal displacement and more), key global figures, a data catalogue, and thematic and regional overviews explaining the sources.
