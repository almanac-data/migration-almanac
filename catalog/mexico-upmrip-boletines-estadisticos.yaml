id: mexico-upmrip-boletines-estadisticos
type: dataset
title: Mexico UPMRIP Migration Statistics Bulletins (Boletines estadísticos)
description: |
  Mexico's official migration statistics from the Unidad de Política Migratoria, Registro e Identidad de Personas (Secretaría de Gobernación): monthly and annual statistical bulletins and data tables on entries, documentation and stay status of foreigners, people in an irregular migration situation presented to the immigration authority, protection of migrants, and returns of Mexicans from the United States and Canada. The key official source on migration through and from Mexico.
publisher: Unidad de Política Migratoria, Registro e Identidad de Personas (UPMRIP), Secretaría de Gobernación
