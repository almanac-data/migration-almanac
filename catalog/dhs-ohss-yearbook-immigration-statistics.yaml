id: dhs-ohss-yearbook-immigration-statistics
type: dataset
title: DHS OHSS Yearbook of Immigration Statistics
description: |
  The Department of Homeland Security's annual compendium of US immigration flow tables by fiscal year: lawful permanent residents, refugees, asylees, naturalizations, nonimmigrant (temporary visitor) admissions, and immigration enforcement actions (apprehensions, removals, returns). Published by the DHS Office of Homeland Security Statistics (OHSS), formerly the Office of Immigration Statistics.
publisher: U.S. Department of Homeland Security, Office of Homeland Security Statistics (OHSS)
