id: ircc-monthly-updates-open-data
type: dataset
title: IRCC Open Data – Monthly IRCC Updates
description: |
  Immigration, Refugees and Citizenship Canada's open datasets on the Canadian immigration system, led by the "Monthly IRCC Updates" series: new permanent residents by category, province and country of citizenship, asylum claimants, study and work permit holders, temporary-to-permanent transitions, Express Entry invitations, and operational processing. The official source for Canadian admissions and asylum claim counts.
