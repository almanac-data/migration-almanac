id: idmc-global-internal-displacement-database
type: dataset
title: IDMC Global Internal Displacement Database (GIDD)
description: |
  The Internal Displacement Monitoring Centre's validated annual estimates of internal displacements (new movements) and internally displaced people at year end, by country and by cause (conflict and violence, disasters), with event-level disaggregated data. The standard global reference for internal displacement figures.
