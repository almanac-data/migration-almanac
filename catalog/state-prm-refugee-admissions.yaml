id: state-prm-refugee-admissions
type: dataset
title: US Refugee Admissions and Arrivals (Refugee Processing Center)
description: |
  The State Department Bureau of Population, Refugees, and Migration's monthly reports on refugees admitted through the U.S. Refugee Admissions Program (USRAP), by country of chargeability, nationality, US state of resettlement and month, plus Amerasian and Iraqi/Afghan Special Immigrant Visa arrivals. The archive holds arrivals by region since 1975 and the annual proposed-admissions reports to Congress. Formerly published as WRAPSNET.
publisher: U.S. Department of State, Bureau of Population, Refugees, and Migration (Refugee Processing Center)
