  Frontex's monthly statistics on detections of illegal border-crossings at the EU's external borders, by migratory route (Central Mediterranean, Western Balkans, Eastern Mediterranean and others), border type and nationality, behind its interactive Migratory Map. The most-cited series on irregular arrivals to the EU.
