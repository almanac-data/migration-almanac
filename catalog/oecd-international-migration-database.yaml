id: oecd-international-migration-database
type: dataset
title: OECD International Migration Database
description: |
  OECD's annual series, provided mostly by national correspondents of the OECD Expert Group on Migration, on inflows and outflows of foreign population and inflows of asylum seekers by nationality, stocks of foreign population, and acquisitions of nationality, for OECD countries. Companion dataflows give standardised permanent and temporary inflows. The basis of the annual International Migration Outlook.
publisher: Organisation for Economic Co-operation and Development (OECD)
