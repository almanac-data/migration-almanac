id: eurostat-migration-and-asylum
type: dataset
title: Eurostat Migration and Asylum Statistics
description: |
  Eurostat's statistics on migration and asylum in the EU and EFTA: immigration and emigration flows and citizenship acquisitions, asylum applications and first-instance and final decisions, Dublin transfers, resettlement, temporary protection for people fleeing Ukraine, residence permits, and enforcement of immigration legislation (refusals at the border, third-country nationals found illegally present, return orders and returns).
