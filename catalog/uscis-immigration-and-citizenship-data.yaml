id: uscis-immigration-and-citizenship-data
type: dataset
title: USCIS Immigration and Citizenship Data
description: |
  U.S. Citizenship and Immigration Services' data library of quarterly and fiscal-year reports on benefit applications: receipts, approvals, denials, pending cases and processing for naturalization (N-400), green cards (I-485), family and employment petitions, employment authorization (I-765), DACA, TPS, T and U visas, special immigrant juveniles and more. The authoritative source on the legal-immigration caseload and backlog.
publisher: U.S. Citizenship and Immigration Services (USCIS)
