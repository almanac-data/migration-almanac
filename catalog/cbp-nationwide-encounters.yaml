id: cbp-nationwide-encounters
type: dataset
title: CBP Nationwide and Southwest Land Border Encounters
description: |
  U.S. Customs and Border Protection monthly encounter counts: U.S. Border Patrol Title 8 apprehensions, Office of Field Operations Title 8 inadmissibles, and Title 42 expulsions (March 2020 to May 2023), nationwide and for the southwest land border, by area of responsibility, state, citizenship and demographic group. The most-cited series on US border crossings.
