id: migracion-colombia-entradas-extranjeros
type: dataset
title: Migración Colombia – Entradas de extranjeros a Colombia
description: |
  Migración Colombia's monthly counts of foreign nationals entering Colombia since 2012, by nationality, sex and migration control post, published on Colombia's open data portal. One of a family of Migración Colombia datasets there (departures of Colombians, Venezuelan entries, temporary protection pre-registrations) covering the main Latin American migration corridor.
