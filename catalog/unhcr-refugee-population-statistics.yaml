id: unhcr-refugee-population-statistics
type: dataset
title: UNHCR Refugee Population Statistics Database (Refugee Data Finder and API)
description: |
  UNHCR's global statistics on forcibly displaced and stateless people: refugees, asylum-seekers, internally displaced persons, returnees and stateless persons by country of origin and asylum, plus asylum applications and decisions, demographics and solutions (resettlement, returns, naturalisation). The reference series for refugee figures worldwide.
